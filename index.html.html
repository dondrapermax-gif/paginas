<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Links</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#111;color:#eee;font-family:system-ui,sans-serif;display:flex;justify-content:center;padding:24px 16px}
  .box{width:100%;max-width:480px}
  h1{font-size:1.2rem;margin:0 0 16px}
  input,button{width:100%;padding:14px;font-size:1rem;border-radius:10px;border:1px solid #333;background:#1c1c1c;color:#eee;margin-bottom:10px}
  button{background:#2d5bff;border:0;font-weight:600;cursor:pointer}
  button.sec{background:#222;border:1px solid #333}
  a.link{display:block;padding:14px;margin-bottom:8px;background:#1c1c1c;border:1px solid #2a2a2a;border-radius:10px;color:#eee;text-decoration:none;word-break:break-all;font-size:.9rem}
  #err{color:#ff6b6b;min-height:1.2em;margin:0 0 8px}
  #list{display:none}
  small{color:#888;display:block;margin-top:12px}
</style>
</head>
<body>
<div class="box">
  <div id="lock">
    <h1>Acesso restrito</h1>
    <input id="pw" type="password" placeholder="Senha" autocomplete="off" autofocus>
    <p id="err"></p>
    <button id="go">Entrar</button>
  </div>
  <div id="list">
    <h1>Links</h1>
    <button id="all">Abrir todos</button>
    <div id="items"></div>
    <button class="sec" id="out">Bloquear</button>
    <small>Para abrir todos, permita pop-ups para esta página na primeira vez. Use esta página dentro de uma aba anônima.</small>
  </div>
</div>

const u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
let links=[];
async function unlock(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(D.s),iterations:300000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(D.i)},key,u8(D.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function tryLogin(){
  const err=document.getElementById("err");err.textContent="";
  try{
    links=await unlock(document.getElementById("pw").value);
    const box=document.getElementById("items");box.innerHTML="";
    links.forEach((l,i)=>{
      const a=document.createElement("a");
      a.className="link";a.href=l;a.target="_blank";a.rel="noopener noreferrer";
      let host="";try{host=new URL(l).hostname.replace("www.","")}catch(e){}
      a.textContent=(i+1)+". "+host;
      box.appendChild(a);
    });
    document.getElementById("lock").style.display="none";
    document.getElementById("list").style.display="block";
  }catch(e){err.textContent="Senha incorreta.";}
}
document.getElementById("go").onclick=tryLogin;
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")tryLogin()});
document.getElementById("all").onclick=()=>{links.forEach(l=>window.open(l,"_blank","noopener,noreferrer"))};
document.getElementById("out").onclick=()=>location.reload();
</script>
</body>
</html>
